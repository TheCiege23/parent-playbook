name: iOS → TestFlight

# Builds the Parent Playbook iPhone app (ios/) on a macOS runner and uploads it to App Store Connect /
# TestFlight. The same pipeline Café Con Chimmy and AllFantasy ship with: no certificates or provisioning
# profiles are stored anywhere. The archive is signed ad hoc, and the export re-signs it for the App Store
# through an App Store Connect API key, creating the distribution certificate and profile on the fly.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID         App Store Connect API key ID, e.g. X792ZL992U
#   ASC_ISSUER_ID      Issuer ID shown above the Team Keys list
#   ASC_KEY_P8         Full contents of the downloaded AuthKey_XXXX.p8 file
# The key needs the App Manager role (or Admin) and must be a Team key, not an Individual key.
#
# It runs by hand from the Actions tab, and on every push to ios-codemagic: a workflow_dispatch workflow
# only shows in the Actions tab once it is on main, and this branch isn't merged yet.

on:
  workflow_dispatch:
  push:
    branches: [ios-codemagic]

jobs:
  testflight:
    # App Store uploads must be built with the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app bundle and sync iOS
        run: |
          npm run native:www
          npx cap sync ios

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # App.entitlements says development so an Xcode debug build on a phone gets sandbox pushes.
      # TestFlight and the App Store deliver through production APNs.
      - name: Production push entitlement
        run: /usr/libexec/PlistBuddy -c "Set :aps-environment production" ios/App/App/App.entitlements

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      # Ad-hoc signing ("-") still embeds the entitlements (push, associated domains) but needs no
      # certificate or profile. Automatic signing would archive with a development profile, which Apple
      # only issues once a test device is registered to the team.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            DEVELOPMENT_TEAM=U52ZD3QY7V \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
